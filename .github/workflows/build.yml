                                                                                                                                                                                       name: Build Vehicle Tracker APK

                                                                                                                                                                                       on:
                                                                                                                                                                                         workflow_dispatch:

                                                                                                                                                                                         jobs:
                                                                                                                                                                                           build:
                                                                                                                                                                                               runs-on: ubuntu-latest

                                                                                                                                                                                                   steps:
                                                                                                                                                                                                         - name: Checkout repository
                                                                                                                                                                                                                 uses: actions/checkout@v4

                                                                                                                                                                                                                       - name: Setup Java
                                                                                                                                                                                                                               uses: actions/setup-java@v4
                                                                                                                                                                                                                                       with:
                                                                                                                                                                                                                                                 distribution: temurin
                                                                                                                                                                                                                                                           java-version: '17'

                                                                                                                                                                                                                                                                 - name: Setup Flutter
                                                                                                                                                                                                                                                                         uses: subosito/flutter-action@v2
                                                                                                                                                                                                                                                                                 with:
                                                                                                                                                                                                                                                                                           channel: stable

                                                                                                                                                                                                                                                                                                 - name: Create Android project
                                                                                                                                                                                                                                                                                                         run: |
                                                                                                                                                                                                                                                                                                                   flutter create \
                                                                                                                                                                                                                                                                                                                               --org com.company \
                                                                                                                                                                                                                                                                                                                                           --project-name vehicletracker \
                                                                                                                                                                                                                                                                                                                                                       --platforms=android \
                                                                                                                                                                                                                                                                                                                                                                   build_app

                                                                                                                                                                                                                                                                                                                                                                         - name: Copy application files
                                                                                                                                                                                                                                                                                                                                                                                 run: |
                                                                                                                                                                                                                                                                                                                                                                                           cp app/pubspec.yaml build_app/pubspec.yaml
                                                                                                                                                                                                                                                                                                                                                                                                     cp app/main.dart build_app/lib/main.dart
                                                                                                                                                                                                                                                                                                                                                                                                               cp app/google-services.json build_app/android/app/google-services.json

                                                                                                                                                                                                                                                                                                                                                                                                                         if [ -d app/assets ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                     cp -R app/assets build_app/
                                                                                                                                                                                                                                                                                                                                                                                                                                               fi

                                                                                                                                                                                                                                                                                                                                                                                                                                                     - name: Configure Firebase
                                                                                                                                                                                                                                                                                                                                                                                                                                                             working-directory: build_app
                                                                                                                                                                                                                                                                                                                                                                                                                                                                     run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                               python3 - <<'PY'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         from pathlib import Path
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   import re

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             settings = next(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           p for p in [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             Path("android/settings.gradle.kts"),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               Path("android/settings.gradle")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ] if p.exists()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       )

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 app = next(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               p for p in [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 Path("android/app/build.gradle.kts"),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   Path("android/app/build.gradle")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ] if p.exists()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           )

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     kts = settings.suffix == ".kts"

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if kts:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             settings_plugin = 'id("com.google.gms.google-services") version "4.4.2" apply false'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           app_plugin = 'id("com.google.gms.google-services")'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     else:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   settings_plugin = "id 'com.google.gms.google-services' version '4.4.2' apply false"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 app_plugin = "id 'com.google.gms.google-services'"

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           text = settings.read_text()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     text = re.sub(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   r'plugins\s*\{',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 lambda m: m.group(0) + '\n    ' + settings_plugin,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               text,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             count=1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 settings.write_text(text)

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           text = app.read_text()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     text = re.sub(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   r'plugins\s*\{',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 lambda m: m.group(0) + '\n    ' + app_plugin,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               text,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             count=1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 app.write_text(text)

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           print("Firebase Gradle plugins configured.")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     PY

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           - name: Build APK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   working-directory: build_app
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     flutter pub get
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               flutter build apk --release

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     - name: Upload APK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               name: vehicle-tracker-apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         path: build_app/build/app/outputs/flutter-apk/app-release.apk