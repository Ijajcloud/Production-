name: Build Vehicle Tracker APK

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --org com.company --project-name vehicletracker --platforms=android build_app

      - name: Copy application files
        run: |
          cp app/main.dart build_app/lib/main.dart
          cp app/pubspec.yaml build_app/pubspec.yaml
          cp app/google-services.json build_app/android/app/google-services.json

      - name: Configure Firebase
        run: |
          sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' build_app/android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' build_app/android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' build_app/android/app/build.gradle.kts

      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-tracker-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
