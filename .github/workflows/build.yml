name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --org com.company --project-name vehicletracker --platforms=android build_app
      - name: Copy our code
        run: |
          cp app/pubspec.yaml build_app/pubspec.yaml
          cp app/main.dart build_app/lib/main.dart
          sed -i 's/flutter.minSdkVersion/23/' build_app/android/app/build.gradle*
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="vehicletracker"|android:label="Vehicle Tracker"|' build_app/android/app/src/main/AndroidManifest.xml
          sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' build_app/android/app/build.gradle*
      - name: Build
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-tracker-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
