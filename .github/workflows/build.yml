name: Build Vehicle Tracker APK

on:
  workflow_dispatch:
    push:
        branches:
              - main

              jobs:
                build:
                    runs-on: ubuntu-latest

                        steps:
                              - name: Checkout
                                      uses: actions/checkout@v4

                                            - name: Setup Java
                                                    uses: actions/setup-java@v4
                                                            with:
                                                                      distribution: temurin
                                                                                java-version: '17'

                                                                                      - name: Setup Flutter
                                                                                              uses: subosito/flutter-action@v2
                                                                                                      with:
                                                                                                                channel: stable

                                                                                                                      - name: Check Firebase configuration
                                                                                                                              run: |
                                                                                                                                        test -f app/google-services.json
                                                                                                                                                  test -f app/pubspec.yaml
                                                                                                                                                            test -f app/main.dart

                                                                                                                                                                  - name: Create Android project
                                                                                                                                                                          run: |
                                                                                                                                                                                    flutter create --org com.company \
                                                                                                                                                                                                --project-name vehicletracker \
                                                                                                                                                                                                            --platforms=android build_app

                                                                                                                                                                                                                  - name: Copy Flutter application
                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                    cp app/pubspec.yaml build_app/pubspec.yaml
                                                                                                                                                                                                                                              cp app/main.dart build_app/lib/main.dart
                                                                                                                                                                                                                                                        cp app/google-services.json build_app/android/app/google-services.json

                                                                                                                                                                                                                                                              - name: Configure Firebase
                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                python3 - <<'PY'
                                                                                                                                                                                                                                                                                          from pathlib import Path

                                                                                                                                                                                                                                                                                                    android = Path("build_app/android")

                                                                                                                                                                                                                                                                                                              settings = android / "settings.gradle"
                                                                                                                                                                                                                                                                                                                        if not settings.exists():
                                                                                                                                                                                                                                                                                                                                      settings = android / "settings.gradle.kts"

                                                                                                                                                                                                                                                                                                                                                app = android / "app/build.gradle"
                                                                                                                                                                                                                                                                                                                                                          if not app.exists():
                                                                                                                                                                                                                                                                                                                                                                        app = android / "app/build.gradle.kts"

                                                                                                                                                                                                                                                                                                                                                                                  s = settings.read_text()
                                                                                                                                                                                                                                                                                                                                                                                            if "com.google.gms.google-services" not in s:
                                                                                                                                                                                                                                                                                                                                                                                                          s = s.replace(
                                                                                                                                                                                                                                                                                                                                                                                                                            "plugins {",
                                                                                                                                                                                                                                                                                                                                                                                                                                              'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            settings.write_text(s)

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      s = app.read_text()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if "com.google.gms.google-services" not in s:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              s = s.replace(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "plugins {",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  'plugins {\n    id("com.google.gms.google-services")',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                app.write_text(s)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          PY

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Set minimum Android SDK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  sed -i 's/flutter.minSdkVersion/23/g' build_app/android/app/build.gradle*

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Build Release APK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                working-directory: build_app
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  flutter pub get
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            flutter build apk --release

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Upload APK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            name: vehicle-tracker-apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      path: build_app/build/app/outputs/flutter-apk/app-release.apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if-no-files-found: error